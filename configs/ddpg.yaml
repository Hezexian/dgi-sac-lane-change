# DDPG baseline: deterministic 2 x 256 actor, one critic
algorithm: ddpg
train:
  total_steps: 500000
  random_steps: 10000           # uniform random actions, no updates
  batch_size: 256
  replay_size: 1000000
  gamma: 0.99
  tau: 0.005                    # soft target update
  lr: 0.0003                    # Adam, actor and critic
  hidden_size: 256
  exploration_noise: 0.1        # Gaussian action noise during training
  eval_every: 25000             # validation on scenarios 310000-310049
  eval_episodes: 50
env_name: highway-fast-v0
env:                            # highway-env configuration (Section 3.1, Online Resource S1)
  observation:
    type: Kinematics
    vehicles_count: 8           # ego vehicle + up to 7 neighbours
    features: [presence, x, y, vx, vy, heading]
    normalize: false
    absolute: false
  action:
    type: ContinuousAction      # acceleration and steering in [-1, 1]
    steering_range: [-1, 1]
    speed_range: [0, 30]
  lanes_count: 4
  vehicles_count: 30
  vehicles_density: 1.0
  duration: 40                  # seconds (200 decisions)
  initial_spacing: 2
  collision_reward: -2.0        # also used when the ego vehicle leaves the road
  right_lane_reward: 0.0
  high_speed_reward: 0.5
  lane_change_reward: 0.0
  reward_speed_range: [20, 30]
  simulation_frequency: 15
  policy_frequency: 5
  normalize_reward: false
  offroad_terminal: true
